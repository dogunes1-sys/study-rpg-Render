<h2>{{email}}</h2>

<h2>Görevler</h2>

{% for key,task in tasks.items() %}
<div style="border:1px solid gray;margin:10px;padding:10px">
<b>{{task.name}}</b><br>
+{{task.coin}} coin | +{{task.xp}} xp<br>
<a href="/task/{{key}}"><button>Yaptım</button></a>
</div>
{% endfor %}

<a href="/gacha"><button>🎰 Gacha Aç (150 coin)</button></a>

<hr>

<h3>Log</h3>

{% endfor %}

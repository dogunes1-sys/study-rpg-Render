<h2>Hoşgeldin {{email}}</h2>

<h3>Coin: {{user.coin}}</h3>
<h3>XP: {{user.xp}}</h3>

<hr>

<h2>Görevler</h2>

{% for key,task in tasks.items() %}
<div style="margin:10px;padding:10px;border:1px solid gray;">
    <b>{{task.name}}</b><br>
    +{{task.coin}} coin | +{{task.xp}} xp<br><br>
    <a href="/task/{{key}}">
        <button>Yaptım ✓</button>
    </a>
</div>
{% endfor %}

<br><br>
<a href="/logout">Çıkış Yap</a>

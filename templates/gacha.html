<!DOCTYPE html>
<html>
<head>
<title>Loot Açılıyor...</title>

<style>
body{
    text-align:center;
    font-family:Arial;
    background:#0f1226;
    color:white;
}

#box{
    margin-top:120px;
    font-size:80px;
    animation:shake 0.7s infinite;
}

@keyframes shake{
    0%{transform:rotate(0deg)}
    25%{transform:rotate(8deg)}
    50%{transform:rotate(0deg)}
    75%{transform:rotate(-8deg)}
    100%{transform:rotate(0deg)}
}

#result{
    display:none;
    margin-top:40px;
}

.common{color:lightgray}
.rare{color:#4da6ff}
.epic{color:#c77dff}
.legendary{
    color:gold;
    font-size:28px;
    text-shadow:0 0 15px gold;
}
</style>
</head>
<body>

<div id="box">🎁</div>

<div id="result">
<h2 class="{{rarity.lower()}}">
{{rarity}}!
</h2>

<h1>{{reward}}</h1>

<br>
<a href="/dashboard"><button>Devam</button></a>
</div>

<script>
setTimeout(()=>{
    document.getElementById("box").style.display="none"
    document.getElementById("result").style.display="block"
},2000)
</script>

</body>
</html>

<html>
<head>
<style>
body{
text-align:center;
font-family:sans-serif;
background:black;
color:white;
}

.box{
font-size:40px;
margin-top:100px;
animation:spin 1s infinite;
}

@keyframes spin{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

.result{
font-size:30px;
margin-top:40px;
animation:fade 2s forwards;
opacity:0;
}

@keyframes fade{
to{opacity:1}
}
</style>
</head>
<body>

<div class="box">🎁</div>

<div class="result">
<h2>{{rarity}}</h2>
<h1>{{reward}}</h1>
<a href="/dashboard"><button>Dön</button></a>
</div>

<script>
setTimeout(()=>{
document.querySelector(".box").style.display="none"
document.querySelector(".result").style.opacity=1
},2000)
</script>

</body>
</html>
